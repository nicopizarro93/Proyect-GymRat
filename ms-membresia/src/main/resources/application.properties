server.port=8086
spring.application.name=ms-membresias

# Conexión a la base de datos exclusiva de membresias
spring.datasource.url=jdbc:mysql://localhost:3306/pb_membresias_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# Recuerda poner la contraseña de tu MySQL local
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate para crear la tabla automáticamente
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/