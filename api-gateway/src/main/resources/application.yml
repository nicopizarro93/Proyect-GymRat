server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: atletas-service
          uri: lb://ms-atletas
          predicates:
            - Path=/api/v1/atletas**
      
        - id: marcas-service
          uri: lb://ms-marcas
          predicates:
            - Path=/api/v1/marcas/**
        
        - id: ejercicios-service
          uri: lb://ms-ejercicios
          predicates:
            - Path=/api/v1/ejercicios/**
        
        - id: verificaciones-service
          uri: lb://ms-verificaciones
          predicates:
            - Path=/api/v1/verificaciones/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    "[org.springframework.cloud.gateway]": TRACE
    "[org.springframework.http.server.reactive]": DEBUG