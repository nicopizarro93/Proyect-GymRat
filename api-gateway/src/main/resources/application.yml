server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: atletas-service
          uri: lb://ms-atletas
          predicates:
            - Path=/api/atletas/**
      
        - id: marcas-service
          uri: lb://ms-marcas
          predicates:
            - "Path=/api/marcas/**"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    "[org.springframework.cloud.gateway]": TRACE
    "[org.springframework.http.server.reactive]": DEBUG