spring.application.name=ms-asistencia
server.port=8081


spring.datasource.url=jdbc:mysql://localhost:3306/pb_asistencia_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# Cambiar 'root' por tu contraseña real de MySQL en este PC
spring.datasource.password=
# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true


# Logs (Exigencia de la rúbrica)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/